{% extends "base.html" %}
{% block extra_css %}
<style>
    .admin-nav { background: #1e293b; }
    .admin-nav .nav-link { color: #cbd5e1; }
    .admin-nav .nav-link:hover, .admin-nav .nav-link.active { color: #fff; }
</style>
{% endblock %}

{% block page_header %}
<nav class="navbar admin-nav navbar-expand-lg navbar-dark px-3">
    <a class="navbar-brand fw-bold" href="{{ url_for('admin.index') }}"><i class="bi bi-shield-lock me-2"></i>E-RateKeeper Admin</a>
    <div class="navbar-nav ms-auto d-flex flex-row gap-3">
        <a class="nav-link {% if request.endpoint == 'admin.index' %}active{% endif %}" href="{{ url_for('admin.index') }}">Tenants</a>
        <a class="nav-link {% if request.endpoint == 'admin.users' %}active{% endif %}" href="{{ url_for('admin.users') }}">Users</a>
        <a class="nav-link {% if request.endpoint == 'admin.funding_summary' %}active{% endif %}" href="{{ url_for('admin.funding_summary') }}">Funding</a>
        <a class="nav-link" href="{{ url_for('auth.logout') }}"><i class="bi bi-box-arrow-right"></i></a>
    </div>
</nav>
{% endblock %}
