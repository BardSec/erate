{% extends "base.html" %}
{% block title %}Platform Admin Login{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock display-4 text-primary"></i>
                        <h4 class="fw-bold mt-2">Platform Admin</h4>
                        <p class="text-muted small">E-RateKeeper Administration</p>
                    </div>

                    {% if allow_local %}
                    <form method="POST" action="{{ url_for('auth.admin_login') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign In</button>
                    </form>
                    {% else %}
                    <div class="alert alert-warning">
                        Local authentication is disabled. Set <code>ALLOW_LOCAL_AUTH=true</code> to enable.
                    </div>
                    {% endif %}

                    <div class="text-center mt-3">
                        <a href="/" class="text-muted small">Back to home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
