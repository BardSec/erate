services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erate
      POSTGRES_PASSWORD: erate
      POSTGRES_DB: erate_manager
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erate -d erate_manager"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    command: >
      sh -c "flask db upgrade && gunicorn --bind 0.0.0.0:8000 --workers 4 wsgi:app"

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
