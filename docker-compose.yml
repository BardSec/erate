services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-erate_manager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erate} -d ${POSTGRES_DB:-erate_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # No ports exposed — only reachable by app over internal network
    restart: unless-stopped

  app:
    build: .
    hostname: app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    networks:
      internal:
        aliases:
          - app
    # No ports exposed — only reachable by cloudflared over internal network
    command: >
      sh -c "flask db upgrade && gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile - wsgi:app"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - app
    links:
      - app
    networks:
      - internal
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  uploads:
